# The Cargo workspace: the engine, one member. The native runner the frame
# floors need (CART.1) is an example of the engine crate,
# engine/examples/frames.rs, and no member of its own, so the lock holds no
# third package. CHARTER.md section 4 is the constitution.
# Its first rule puts the language in its own crate, vla-lang, cut out of
# frazaro-core in the Frazaro repository, which this workspace pins under
# [workspace.dependencies] since ENGINE.1's second slice. Its fifth rule,
# AD-5, is why the engine's [dependencies] holds that one line: the engine's
# imports are the host's functions, named by hand, and the crate depends on
# the language crate and nothing else, which tools/check_engine_deps.ps1
# holds on this file, the engine's manifest and Cargo.lock.
#
# Build the engine for the browser with
#   cargo build --release -p alonzo --target wasm32-unknown-unknown
# and tools/check_host_imports.ps1 then holds the module's import section to
# its allowlist, exactly: every import listed under the one module name
# alonzo, every listed name imported, and the count pinned beside the list,
# zero today, until SPEC.1 names the first (REPO.2).

[workspace]
resolver = "2"
members = ["engine"]

[workspace.package]
# Alonzo's own line, not the corpus's: the engine is not an implementation
# of the language, so its version is its own, and vla-lang is pinned exactly
# below.
version = "0.1.0"
# The same edition and floor as frazaro-core, and so as vla-lang, so that the
# three crates build under one toolchain.
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/Spreadsheet-Company/Alonzo"

[workspace.dependencies]
# The language crate and nothing else (AD-5), pinned to one version on
# crates.io: vla-lang 0.9.3 (Frazaro's release commit 17f9f3e, tagged
# v0.9.3 on 8993a7e, 2026-10-14): a formula written into a running grid in
# the time its cells take (KERNEL.34); a changed cell checked against the
# readers kept where it stands (KERNEL.35); a frame's end copying what
# changed, however much changed (KERNEL.36); a window's values without its
# formulas' texts, a third projection (KERNEL.37); and the licence texts and
# the NOTICE in the package; over 0.9.2, the plan printed as rows, the
# machine's census, which describe appends (KERNEL.30); a plan's edges found
# once a shape, a held column read once across a row and a row of single
# cells reached as one span, the three asks of CART.2's playtest pass
# (KERNEL.33); and an expander whose walk of a list costs its length
# (VLA.2); over 0.9.1, the
# language's ROW, COLUMN, MOD, INT, ABS, SIN and CHOOSE computed across a
# run's cells (KERNEL.28, CART.2's decision 14);
# over 0.9.0, a frame computing only the cells a change reaches and a filled
# formula at all its cells at once (KERNEL.20's first four slices, KERNEL.26
# and KERNEL.27), the limits a stranger's text is refused by (VLA.1), and the
# ten expand-time primitives (VLA.3); over 0.8.1, the evaluator's hot path
# (KERNEL.25), the plane kept at the frame's end (KERNEL.24) and the handle
# and the four calls (KERNEL.22). The owner's route (2026-10-09;
# REARVIEW.md, ENGINE.1's second slice, decision 1): a git rev while the
# language's change is unreleased, and the exact registry pin once it is,
# 0.8.1 on 2026-10-10, 0.9.0 on 2026-10-11, 0.9.1 and 0.9.2 on 2026-10-12,
# and 0.9.3 on 2026-10-14, no git rev between them. An exact version and
# never a range, a rev and never a branch, since a range and a branch move.
vla-lang = "=0.9.3"

[profile.release]
# Small, deterministic, and without an unwinder: a panic aborts, so the wasm
# module imports nothing to unwind with and nothing to print with. Copied
# from Frazaro's workspace, where it is what keeps the import section empty.
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"
strip = true
