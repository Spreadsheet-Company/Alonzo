[package]
name = "alonzo"
description = "The browser's Lisp machine: a game engine in WebAssembly whose language is VLA, whose scene is a grid of cells, and whose devices are sheets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# What crates.io will show and index. The page is this directory's README,
# written for a first-time visitor, as frazaro-core's is.
readme = "README.md"
keywords = ["wasm", "game-engine", "spreadsheet", "lisp", "cellular-automaton"]
categories = ["game-engines", "wasm"]
# Nothing to publish until the engine renders: the first release removes
# this line as one of its steps (REARVIEW.md, REPO.1, decision 6), so that
# no rehearsal can upload an engine that draws nothing.
publish = false

[lib]
# rlib for the workspace's own native runner to come; cdylib for the wasm32
# build the browser loads.
crate-type = ["rlib", "cdylib"]

[dependencies]
# The language crate, as the workspace pins it, and nothing else, ever
# (AD-5; tools/check_engine_deps.ps1). Its C surface stays unexported: the
# crate's `c-abi` feature is never turned on here, so the module exports the
# engine's eleven names alone (tools/check_host_exports.ps1). The engine's
# imports are the host's functions, declared by hand as extern "C" and held
# to tools/check_host_imports.ps1's list, empty today.
vla-lang.workspace = true
