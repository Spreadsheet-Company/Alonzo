[package]
name = "alonzo"
description = "The browser's Lisp machine: a game engine in WebAssembly whose language is VLA, whose scene is a grid of cells, and whose devices are sheets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# What crates.io shows and indexes. The page is this directory's README,
# written for a first-time visitor, as frazaro-core's is. A package is this
# directory and nothing beside it: the catalog the engine embeds lives in
# data/, the root's LICENSE and NOTICE are copied here, and the tests read
# the repository's cartridges/ at run time and stand down by name without
# it (src/repository.rs), so a package's own tests build and run;
# tools/check_crate_package.ps1 holds all three.
readme = "README.md"
keywords = ["wasm", "game-engine", "spreadsheet", "lisp", "cellular-automaton"]
categories = ["game-engines", "wasm"]
# The three examples, the floors' runner, the pass's command line and the
# playtest session, read the repository's cartridges/, and the pass writes
# into it, so they stay out of the package a visitor downloads, as
# frazaro-core's runner does. Published from 0.1.0 (REPO.4): the line
# `publish = false`, which REPO.1's decision 6 set until the engine drew a
# frame, went as that decision planned; the first version goes up by hand,
# and every later one by .github/workflows/publish.yml.
exclude = ["examples/"]

[lib]
# rlib for the native runner of the frame floors, examples/frames.rs (CART.1),
# and the engine's tests; cdylib for the wasm32 build the browser loads.
crate-type = ["rlib", "cdylib"]

[dependencies]
# The language crate, as the workspace pins it, and nothing else, ever
# (AD-5; tools/check_engine_deps.ps1). Its C surface stays unexported: the
# crate's `c-abi` feature is never turned on here, so the module exports the
# engine's eleven names alone (tools/check_host_exports.ps1). The engine's
# imports are the host's functions, declared by hand as extern "C" and held
# to tools/check_host_imports.ps1's list, empty today.
vla-lang.workspace = true
